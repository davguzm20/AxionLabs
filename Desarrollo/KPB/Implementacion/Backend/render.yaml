services:
  - type: web
    name: kpb-backend
    runtime: python
    rootDir: Desarrollo/KPB/Implementacion/Backend
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
    - key: PYTHON_VERSION
      value: 3.14.8
    - key: UV_VERSION
      value: 0.13.0
