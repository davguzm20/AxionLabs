[project]
name = "kpb-backend"
version = "0.1.0"
description = "Backend del proyecto KhipuBot"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
